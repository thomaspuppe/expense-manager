<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <link rel="manifest" href="/assets/manifest.webmanifest">
  <link rel="stylesheet" href="/assets/style.css">
  <title>Overview</title>
</head>
<body>
  <header class="topbar">
    <a class="ghost" href="/">‹ Add</a>
    <span class="brand">Overview</span>
    <form method="post" action="/logout"><button class="ghost" type="submit">Log out</button></form>
  </header>

  <main class="review">
    <div class="monthnav">
      <button id="prev" class="navbtn" aria-label="Previous month">‹</button>
      <span id="month-label" class="month-label"></span>
      <button id="next" class="navbtn" aria-label="Next month">›</button>
    </div>

    <div id="total" class="total">€&nbsp;0.00</div>
    <div id="breakdown" class="breakdown"></div>

    <h2 class="section-title">History</h2>
    <div id="history" class="history"></div>
  </main>

  <div id="editbg" class="modalbg" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-label="Edit expense">
      <label class="field">Amount (€)
        <input id="edit-amount" type="number" step="0.01" min="0" inputmode="decimal">
      </label>
      <label class="field">Category
        <select id="edit-category">
          {{range .Categories}}<option value="{{.Key}}">{{.Icon}} {{.Label}}</option>{{end}}
        </select>
      </label>
      <label class="field">Date
        <input id="edit-date" type="date">
      </label>
      <label class="field">Note
        <input id="edit-note" type="text" maxlength="140" autocomplete="off">
      </label>
      <p id="edit-error" class="modal-error" role="alert" hidden></p>
      <div class="modal-actions">
        <button id="edit-save" class="primary" type="button">Save</button>
        <button id="edit-cancel" class="secondary" type="button">Cancel</button>
        <button id="edit-delete" class="danger" type="button">Delete</button>
      </div>
    </div>
  </div>

  <script>window.__CATEGORIES__ = {{.CategoriesJSON}};</script>
  <script src="/assets/review.js"></script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
