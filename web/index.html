<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <link rel="manifest" href="/assets/manifest.webmanifest">
  <link rel="stylesheet" href="/assets/style.css">
  <title>Expenses</title>
</head>
<body>
  <header class="topbar">
    <span class="brand">Expenses</span>
    <a class="ghost" href="/review">This month ›</a>
  </header>

  <main class="entry">
    <div id="error" class="banner" hidden>
      <span id="error-text">No connection — not saved.</span>
      <button id="retry" type="button">Retry</button>
    </div>

    <div id="amount" class="amount" aria-live="polite">€&nbsp;0.00</div>

    <div class="numpad" role="group" aria-label="Amount keypad">
      <button class="key" data-digit="1">1</button>
      <button class="key" data-digit="2">2</button>
      <button class="key" data-digit="3">3</button>
      <button class="key" data-digit="4">4</button>
      <button class="key" data-digit="5">5</button>
      <button class="key" data-digit="6">6</button>
      <button class="key" data-digit="7">7</button>
      <button class="key" data-digit="8">8</button>
      <button class="key" data-digit="9">9</button>
      <button class="key key-zero" data-digit="0">0</button>
      <button class="key key-back" id="backspace" aria-label="Delete last digit">⌫</button>
    </div>

    <button id="extra-toggle" class="extra-toggle" type="button" aria-expanded="false">＋ note · date</button>
    <div id="extra" class="extra" hidden>
      <input id="note" type="text" placeholder="Note (optional)" maxlength="140" autocomplete="off">
      <input id="date" type="date">
    </div>

    <div class="categories" role="group" aria-label="Categories">
      {{range .Categories}}
      <button class="cat" data-key="{{.Key}}">
        <span class="cat-icon" aria-hidden="true">{{.Icon}}</span>
        <span class="cat-label">{{.Label}}</span>
        <span class="cat-check" aria-hidden="true">✓</span>
      </button>
      {{end}}
    </div>
  </main>

  <script src="/assets/app.js"></script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
